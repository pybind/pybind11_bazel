# ref: https://github.com/actions/runner-images
name: amd64 Linux Bazel

on: [push, pull_request, workflow_dispatch]

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

# Building using the github runner environement directly.
jobs:
  native:
    name: Linux•Bzl${{matrix.bazel.version}}•C++${{matrix.cpp.version}}•Py${{matrix.python.version}}•${{matrix.examples.name}}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        examples: [{name: basic}, {name: embed}]
        bazel: [
          #{version: "7.x"},
          {version: "8.x"},
          {version: "9.x"},
        ]
        cpp: [
          {version: 17, flags: "-std=c++17"},
          #{version: 20, flags: "-std=c++20"},
        ]
        python: [
          {version: '3.10'},
          #{version: '3.11'},
          {version: '3.12'},
          #{version: '3.13'},
          {version: '3.14'},
        ]
    env:
      USE_BAZEL_VERSION: ${{matrix.bazel.version}}
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{github.workflow}}
          repository-cache: true
      - name: Check Bazel
        run: bazel version
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{matrix.python.version}}
      - name: Check Python
        run: |
          python --version
          python -m platform
      - name: Build
        run: >
          cd examples/${{matrix.examples.name}} &&
          bazel build
          --config=ci
          --@rules_python//python/config_settings:python_version=${{matrix.python.version}}
          --cxxopt=${{matrix.cpp.flags}} --host_cxxopt=${{ matrix.cpp.flags }}
          --subcommands=pretty_print
          //...
      - name: Test
        run: >
          cd examples/${{matrix.examples.name}} &&
          bazel test
          --config=ci
          --@rules_python//python/config_settings:python_version=${{matrix.python.version}}
          --cxxopt=${{matrix.cpp.flags}} --host_cxxopt=${{ matrix.cpp.flags }}
          --subcommands=pretty_print
          //...

  amd64_linux_bazel:
    runs-on: ubuntu-latest
    needs: native
    steps:
      - uses: actions/checkout@v7
